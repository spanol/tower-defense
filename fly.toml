# Fly.io config for the Tower Defense WebSocket game server.
# Deploy: `fly launch --no-deploy` (accept this config) then `fly deploy`.
# Fly routes external 443/80 -> internal_port; it does NOT inject PORT,
# so the server's default 3001 (see server/src/index.ts) matches internal_port.
app = "td-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.server"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

# A persistent volume keeps the SQLite DB (match history / leaderboard)
# across restarts. Create once: `fly volumes create td_data --size 1`.
[mounts]
  source = "td_data"
  destination = "/data"
